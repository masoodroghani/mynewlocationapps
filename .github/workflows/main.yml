name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build App A
        working-directory: LocationSecurityLab/AppA-LocationSimulator
        run: gradle assembleDebug

      - name: Build App B
        working-directory: LocationSecurityLab/AppB-LocationDetector
        run: gradle assembleDebug

      - name: Upload App A APK
        uses: actions/upload-artifact@v4
        with:
          name: AppA-LocationSimulator
          path: LocationSecurityLab/AppA-LocationSimulator/app/build/outputs/apk/debug/*.apk

      - name: Upload App B APK
        uses: actions/upload-artifact@v4
        with:
          name: AppB-LocationDetector
          path: LocationSecurityLab/AppB-LocationDetector/app/build/outputs/apk/debug/*.apk
